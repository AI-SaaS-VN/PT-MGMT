# Alembic 配置文件
# 参考：https://alembic.sqlalchemy.org/en/latest/tutorial.html
#
# 注意：sqlalchemy.url 不在此文件中配置，改由 alembic/env.py 从环境变量读取，
# 以避免在版本控制中暴露数据库密码。

[alembic]
# alembic 迁移脚本目录
script_location = alembic

# 迁移文件名格式：0001_xxx.py, 0002_xxx.py ...
file_template = %%(rev)s_%%(slug)s

# 时区（迁移文件头部时间戳）
timezone = UTC

# 从数据库比较时截断的 SQL 注释长度
truncate_slug_length = 40

# 是否在迁移文件中插入分隔注释
output_encoding = utf-8


# -----------------------------------------------------------------------
# 日志配置（供 logging.config.fileConfig 使用）
# -----------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
